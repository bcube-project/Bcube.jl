## adapted from :
## https://github.com/SciML/OrdinaryDiffEq.jl/blob/master/.github/workflows/Downstream.yml

name: IntegrationTest
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
    inputs:
      tutorials_branch:
        description: 'Branch of BcubeTutorials.jl to test against (default: main or matching branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package.repo }}/${{ matrix.package.group }}/${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    env:
      GROUP: ${{ matrix.package.group }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10"]
        os: [ubuntu-latest]
        package:
          - {user: bcube-project, repo: BcubeTutorials.jl}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/julia-buildpkg@v1
      - name: Determine BcubeTutorials branch
        id: tutorials_branch
        shell: bash
        # Untrusted values (branch name from a fork) go through env, never `${{ }}` in `run`
        env:
          INPUT_BRANCH: ${{ github.event.inputs.tutorials_branch }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Priority order for determining the branch:
          # 1. workflow_dispatch input (if provided)
          # 2. Matching branch name in BcubeTutorials (if exists)
          # 3. main (default)

          TUTORIALS_BRANCH=""

          # Check for workflow_dispatch input
          if [ -n "$INPUT_BRANCH" ]; then
            TUTORIALS_BRANCH="$INPUT_BRANCH"
            echo "Using branch from workflow_dispatch input: $TUTORIALS_BRANCH"
          # Try matching branch name for PRs
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Check if matching branch exists in BcubeTutorials
            if curl -sf "https://api.github.com/repos/bcube-project/BcubeTutorials.jl/branches/$BRANCH_NAME" > /dev/null 2>&1; then
              TUTORIALS_BRANCH="$BRANCH_NAME"
              echo "Using matching branch: $TUTORIALS_BRANCH"
            else
              TUTORIALS_BRANCH="main"
              echo "No matching branch found, using: $TUTORIALS_BRANCH"
            fi
          else
            TUTORIALS_BRANCH="main"
            echo "Using default branch: $TUTORIALS_BRANCH"
          fi

          echo "branch=$TUTORIALS_BRANCH" >> $GITHUB_OUTPUT

      - name: Determine BcubeVTK and BcubeGmsh branches
        id: deps_branches
        if: github.event_name == 'pull_request'
        shell: bash
        # Untrusted values (branch name from a fork) go through env, never `${{ }}` in `run`
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the branch of the same name as the PR branch when it exists, otherwise
          # leave the output empty so that the registered version is used.
          for repo in BcubeVTK BcubeGmsh; do
            if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/bcube-project/$repo.jl/branches/$BRANCH_NAME" > /dev/null 2>&1; then
              echo "Using matching $repo branch: $BRANCH_NAME"
              echo "${repo,,}=$BRANCH_NAME" >> $GITHUB_OUTPUT
            else
              echo "No matching $repo branch found, using the registered version"
            fi
          done

      - name: Clone Downstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream
          ref: ${{ steps.tutorials_branch.outputs.branch }}
          lfs: "true"

      - name: Load this and run the downstream tests
        env:
          BCUBE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          BCUBEVTK_BRANCH: ${{ steps.deps_branches.outputs.bcubevtk }}
          BCUBEGMSH_BRANCH: ${{ steps.deps_branches.outputs.bcubegmsh }}
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          Pkg.test(coverage=true)  # resolver may fail with test time deps
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: lcov.info
          fail_ci_if_error: true
